{% assign k = site.data.kontakt %}
<section class="contact" id="kontakt">
  <div class="wrap">
    <div class="split">
      <div>
        <p class="secnum">{{ k.eyebrow }}</p>
        <h2>{{ k.title }}</h2>
      </div>
      <div>
        <p class="lead">{{ k.lead }}</p>
        <div class="links">
          {% for l in k.links %}
          <a href="{{ l.url }}"{% unless l.url contains 'mailto' %} target="_blank" rel="noopener"{% endunless %}>{{ l.label }}</a>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
