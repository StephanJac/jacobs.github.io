  alt: "Unterwegs im Training"
  shot: "Foto einsetzen: Du in Bewegung — Seitenprofil, Gegenlicht, kein Zielfoto mit Startnummer"

feature_title: "Was der Sport mit dem Beruf zu tun hat"
feature_text:
  - >-
    Trainingssteuerung ist im Kern nichts anderes als ein Planungsmodell:
    Ist-Daten, Zielwerte, Abweichungsanalyse, Szenarien. Nur ist der
    Feedbackzyklus kürzer und das Ergebnis unbestechlicher. Wer drei Wochen lügt,
    sieht es am vierten Sonntag.
  - >-
    Der wichtigste Übertrag ist aber ein anderer: Fortschritt entsteht nicht durch
    die eine perfekte Einheit, sondern durch die achtzigste unspektakuläre. Auch
    das gilt für Datenarchitekturen.

