eyebrow: "02 — Ausdauersport"
title: "Lange Einheiten, ehrliche Zahlen"
lead:
  - >-
    Ausdauersport ist der Teil meines Lebens, in dem ich am direktesten erlebe,
    was Daten können — und wo ihre Grenze liegt. Jede Einheit wird gemessen,
    ausgewertet und in einen Plan eingeordnet. Und trotzdem entscheidet am Ende,
    ob man an einem nasskalten Dienstag rausgeht.
  - >-
    Diese Doppelperspektive nehme ich mit in Projekte: Ich weiß, wie hilfreich
    eine gute Kennzahl ist. Und wie leicht man sich mit ihr etwas vormacht.

