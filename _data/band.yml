eyebrow: "03 — Metal"
title: "The Royal Flash"
lead:
  - >-
    **Authentic Metal from the Heart of Germany.** Eine Metal-Band aus dem
    Ruhrpott, die Metal und Rock mit Einflüssen aus allerlei Genres mischt. Der
    größte Teil des Materials ist selbst geschrieben, dazu kommen ein paar Cover
    als Überraschung.
  - >-
    Spaß ist eine der Hauptmotivationen — was nicht heißt, dass wir uns nicht nach
    den Sternen strecken. Wir suchen ständig nach Bühnen, auf denen wir das
    Material zeigen können.

