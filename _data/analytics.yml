eyebrow: "01 — Business Analytics"
title: "Aus Daten bessere Entscheidungen machen"
lead:
  - >-
    Ich beschäftige mich damit, wie Unternehmen ihre Daten nicht nur technisch
    verfügbar machen, sondern daraus echte Entscheidungsgrundlagen schaffen. Mein
    Schwerpunkt liegt auf modernen SAP-Analytics-Architekturen: SAP Business Data
    Cloud, SAP Analytics Cloud, SAP Datasphere, Embedded Analytics und SAP BW.
  - >-
    Angefangen hat das eher zufällig mit SAP BW. Seitdem begleite ich Unternehmen
    bei Analytics-, Reporting- und Planungslösungen – und interessiere mich
    besonders für die Stelle, an der Technologie auf fachliche Anforderung trifft.
    Welche Architektur ist wirklich sinnvoll? Welche Daten gehören wohin? Und wie
    entstehen Lösungen, die Fachbereiche tatsächlich benutzen?

