quote: "„Nicht wie wir noch einen Bericht bauen — sondern wie wir aus Daten bessere Entscheidungen machen.“"
quote_who: "Worum es mir geht"
outro: >-
  Technologien ändern sich schnell. Die eigentlichen Herausforderungen bleiben:
  unterschiedliche Systeme, heterogene Datenmodelle, komplexe Anforderungen und
  die Frage, welcher Ansatz langfristig trägt. Genau an dieser Schnittstelle
  arbeite ich am liebsten.
