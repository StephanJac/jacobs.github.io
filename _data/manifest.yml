eyebrow: "00 — Das Prinzip"
title: "Drei Systeme, dieselbe Mechanik"
lead: >-
  Eine Datenarchitektur, ein Trainingsplan und ein Bandprobenraum haben mehr
  gemeinsam, als es aussieht. In allen drei Fällen entscheidet nicht der geniale
  Einfall, sondern ob die Struktur den Alltag übersteht. Was nur einmal
  funktioniert hat, hat nicht funktioniert.
items:
  - num: "01"
    word: "Last"
    text: >-
      Systeme zeigen ihren Charakter unter Belastung – im Monatsabschluss, im
      letzten Drittel, in der letzten Zugabe. Alles davor ist Behauptung.
  - num: "02"
    word: "Takt"
    text: >-
      Batchlauf, Trittfrequenz, Tempo. Der gemeinsame Nenner ist
      Wiederholbarkeit: dieselbe Qualität beim hundertsten Mal wie beim ersten.
  - num: "03"
    word: "Ehrlichkeit"
    text: >-
      Daten lügen nicht, Trainingsdaten schon gar nicht – man muss sie nur lesen
      wollen. Dasselbe gilt für Aufnahmen der eigenen Band.
